<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriVida - Iniciar Sesión</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">NutriVida</a>

      <button class="navbar__toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span><span></span>
      </button>

      <nav class="navbar__nav" id="navMenu">
        <a href="index.html" class="navbar__link">Inicio</a>
        <a href="catalogo.html" class="navbar__link">Catálogo</a>
        <a href="nosotros.html" class="navbar__link">Nosotros</a>
        <a href="blogs.html" class="navbar__link">Blog</a>
        <a href="contacto.html" class="navbar__link">Contacto</a>
        <a href="login.html" class="navbar__link navbar__link--cta is-active">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="contenedor login-wrapper">
    <div class="login-card">
      <h1>Iniciar Sesión</h1>
      
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="ejemplo@correo.com">
          <div id="errorEmail" class="error-msg">Ingresa un correo electrónico válido.</div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres">
          <div id="errorPassword" class="error-msg">La contraseña debe tener al menos 6 caracteres.</div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="recordarme">
          <label for="recordarme" style="font-size: 0.9rem; cursor: pointer;">Recordarme</label>
        </div>

        <button type="submit" class="btn-primario">Ingresar</button>
      </form>

      <div class="registro-link">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
