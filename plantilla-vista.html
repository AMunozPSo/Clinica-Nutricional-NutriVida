<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Servicios - NutriVida</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="css/global.css">
    <!-- CSS Específico de esta vista -->
    <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar__logo">NutriVida</div>
        <nav class="navbar__menu">
            <a href="catalogo.html">Servicios</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <!-- Contenido principal de la vista -->
    <main class="section">
        <div class="container">
            <h1 class="text-center">Nuestros Servicios</h1>
            
            <!-- Barra de Filtros -->
            <section class="filters-container form">
                <div class="form__field">
                    <label for="buscarInput">Buscar servicio:</label>
                    <input type="text" id="buscarInput" placeholder="Ej. Consulta, Taller...">
                </div>
                
                <div class="form__field">
                    <label for="categoriaSelect">Categoría:</label>
                    <select id="categoriaSelect">
                        <option value="todas">Todas las categorías</option>
                        <option value="Control de Peso">Control de Peso</option>
                        <option value="Nutrición Deportiva">Nutrición Deportiva</option>
                        <option value="Vegetariana">Nutrición Vegetariana</option>
                        <option value="Talleres">Educación y Talleres</option>
                    </select>
                </div>

                <div class="form__field">
                    <label for="modalidadSelect">Modalidad:</label>
                    <select id="modalidadSelect">
                        <option value="todas">Ambas</option>
                        <option value="Presencial">Presencial</option>
                        <option value="Online">Online</option>
                    </select>
                </div>
            </section>

            <!-- Contenedor donde JS inyectará las tarjetas -->
            <div id="catalogoGrid" class="cards-grid">
                
            </div>
        </div>
    </main>

    <!-- Footer-->
    <footer class="footer">
        <p>&copy; 2026 Clínica NutriVida. Todos los derechos reservados.</p>
    </footer>

    <!-- JS de la vista -->
    <script src="js/catalogo.js"></script>
</body>
</html>
