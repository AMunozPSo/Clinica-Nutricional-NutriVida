<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriVida - Detalle del Servicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/detalle-servicio.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">NutriVida</a>
      <button class="navbar__toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="navbar__nav" id="navMenu">
        <a href="index.html" class="navbar__link">Inicio</a>
        <a href="catalogo.html" class="navbar__link">Catálogo</a>
        <a href="nosotros.html" class="navbar__link">Nosotros</a>
        <a href="blogs.html" class="navbar__link">Blog</a>
        <a href="contacto.html" class="navbar__link">Contacto</a>
        <a href="login.html" class="navbar__link navbar__link--cta" id="navAuthLink">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <section>
      <h1 id="detalle-titulo">Cargando servicio...</h1>
      <p id="detalle-categoria" style="color: var(--color-5); font-size: 1.1rem; font-weight: 500;"></p>
    </section>

    <section class="detalle-grid">
      <div class="detalle-contenido">
        <h2>Descripción del Servicio</h2>
        <p id="detalle-desc">Por favor espera un momento...</p>
        
        <div style="margin-top: 30px;">
          <a href="#" id="btn-agendar" class="btn-primario">Agendar este servicio</a>
        </div>
      </div>

      <aside class="detalle-sidebar">
        <div class="profesional-card">
          <h3 style="margin-top: 0;">Especialista a Cargo</h3>
          <div style="display: flex; align-items: center; gap: 15px; margin-top: 15px;">
            <div style="width: 60px; height: 60px; background-color: var(--color-3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">👨‍⚕️</div>
            <div>
              <strong id="detalle-doctor" style="color: var(--color-5); display: block;">Cargando...</strong>
              <span style="font-size: 0.9rem; color: var(--color-4);">Nutrición Clínica</span>
            </div>
          </div>
          <p id="detalle-precio" style="font-size: 1.2rem; font-weight: bold; color: var(--color-forest); margin-top: 15px;"></p>
        </div>
      </aside>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/session.js"></script>
  <script src="js/detalle-servicio.js"></script>
</body>
</html>
