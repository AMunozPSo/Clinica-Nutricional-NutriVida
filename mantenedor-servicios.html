<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenedor de Servicios - NutriVida</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/global.css">
    <!-- CSS Específico de esta vista -->
    <link rel="stylesheet" href="css/mantenedor.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar__logo">NutriVida Admin</div>
        <nav class="navbar__menu">
            <a href="home-admin.html">Inicio</a>
            <a href="mantenedor-servicios.html">Servicios</a>
            <a href="mantenedor-usuarios.html">Usuarios</a>
        </nav>
    </header>

    <!-- Contenido principal de la vista -->
    <main class="section">
        <div class="container">
            <h1>Mantenedor de servicios</h1>

            <button id="btn-nuevo" class="btn btn--primary">+ Nuevo servicio</button>

            <!-- Tabla de servicios -->
            <table class="table" id="tabla-servicios">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Modalidad</th>
                        <th>Precio</th>
                        <th>Duración</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tabla-servicios-body">
                    <!-- Las filas se generan con JS -->
                </tbody>
            </table>
            <p id="mensaje-vacio" class="text-muted" hidden>Aún no hay servicios registrados.</p>

            <!-- Modal / formulario de nuevo o editar servicio -->
            <div class="modal" id="modal-servicio" hidden>
                <div class="modal__contenido">
                    <h2 id="modal-titulo">Nuevo servicio</h2>

                    <form id="form-servicio" class="form" novalidate>
                        <input type="hidden" id="servicio-id">

                        <div class="form__field">
                            <label for="nombre">Nombre del servicio</label>
                            <input type="text" id="nombre" name="nombre" maxlength="100" required>
                            <span class="form__error" id="error-nombre"></span>
                        </div>

                        <div class="form__field">
                            <label for="categoria">Categoría</label>
                            <select id="categoria" name="categoria" required>
                                <option value="">-- Selecciona --</option>
                                <option value="Control de Peso">Control de Peso</option>
                                <option value="Nutrición Deportiva">Nutrición Deportiva</option>
                                <option value="Vegetariana">Nutrición Vegetariana</option>
                                <option value="Talleres">Educación y Talleres</option>
                            </select>
                            <span class="form__error" id="error-categoria"></span>
                        </div>

                        <div class="form__field">
                            <label for="modalidad">Modalidad</label>
                            <select id="modalidad" name="modalidad" required>
                                <option value="">-- Selecciona --</option>
                                <option value="Presencial">Presencial</option>
                                <option value="Online">Online</option>
                            </select>
                            <span class="form__error" id="error-modalidad"></span>
                        </div>

                        <div class="form__field">
                            <label for="precio">Precio (CLP)</label>
                            <input type="number" id="precio" name="precio" min="0" required>
                            <span class="form__error" id="error-precio"></span>
                        </div>

                        <div class="form__field">
                            <label for="duracion">Duración (minutos)</label>
                            <input type="number" id="duracion" name="duracion" min="1" required>
                            <span class="form__error" id="error-duracion"></span>
                        </div>

                        <div class="form__field">
                            <label for="descripcion">Descripción breve</label>
                            <textarea id="descripcion" name="descripcion" maxlength="300" rows="3" required></textarea>
                            <span class="form__error" id="error-descripcion"></span>
                        </div>

                        <div class="modal__acciones">
                            <button type="button" class="btn btn--secondary" id="btn-cancelar">Cancelar</button>
                            <button type="submit" class="btn btn--primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer-->
    <footer class="footer">
        <p>&copy; 2026 Clínica NutriVida. Todos los derechos reservados.</p>
    </footer>

    <!-- JS de la vista -->
    <script src="js/mantenedor-servicios.js"></script>
</body>
</html>
