<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriVida - Solicitar Cita</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/solicitud.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar_logo">NutriVida</a>

      <button class="navbar__toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span><span></span>
      </button>

      <nav class="navbar__nav" id="navMenu">
        <a href="index.html" class="navbar__link">Inicio</a>
        <a href="catalogo.html" class="navbar__link">Catálogo</a>
        <a href="nosotros.html" class="navbar__link">Nosotros</a>
        <a href="blogs.html" class="navbar__link">Blog</a>
        <a href="contacto.html" class="navbar__link">Contacto</a>
        <a href="login.html" class="navbar__link navbar__link--cta">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="solicitud-wrapper">
    <div class="form-card">
      <h1>Agenda tu hora</h1>
      <p>Completa los datos para solicitar tu evaluación nutricional.</p>
      
      <form id="formulario-cita" novalidate>
        
        <div class="form-group">
          <label for="servicio">Servicio seleccionado</label>
          <input type="text" id="servicio" value="Evaluación Nutricional Integral ($25.000)" readonly>
        </div>

        <div class="form-group">
          <label for="nutricionista">Nutricionista preferido</label>
          <select id="nutricionista">
            <option value="">-- Selecciona un profesional --</option>
            <option value="Dra. Andrea Valdés">Dra. Andrea Valdés</option>
            <option value="Nut. Carlos Santander">Nut. Carlos Santander</option>
            <option value="Sin preferencia">Sin preferencia (El más próximo)</option>
          </select>
        </div>

        <!-- Layout en línea para pantalla ancha -->
        <div style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha">
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="horario">Hora preferida</label>
            <input type="time" id="horario">
          </div>
        </div>

        <div class="form-group">
          <label for="motivo">Motivo de consulta (Breve)</label>
          <textarea id="motivo" rows="3" placeholder="Ej: Quiero mejorar mi rendimiento..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Confirmar Solicitud</button>
        
        <div id="mensaje-resultado" class="mensaje-alerta"></div>

      </form>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/solicitud.js"></script>
</body>
</html>
